<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autonomous Lab Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background-color: #f3f4f6; }
        .log-entry { margin-bottom: 0.5rem; font-family: monospace; }
        .log-success { color: #10b981; }
        .log-info { color: #3b82f6; }
        .log-warn { color: #f59e0b; }
    </style>
</head>
<body class="text-gray-800">

    <div class="max-w-6xl mx-auto p-6">
        <header class="mb-8 border-b pb-4">
            <h1 class="text-3xl font-bold text-gray-900">DIFFER Autonomous Lab Dashboard</h1>
            <p class="text-gray-600 mt-2">Agentic AI-Driven Materials Discovery</p>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Left Column: Inputs -->
            <div class="space-y-6">
                
                <!-- Elements Database -->
                <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-200">
                    <h2 class="text-xl font-semibold mb-4">1. Base Elements Selection</h2>
                    <p class="text-sm text-gray-600 mb-3">Select 2 to 5 elements for alloy generation.</p>
                    <div id="elements-list" class="grid grid-cols-3 gap-2 max-h-48 overflow-y-auto p-2 border rounded bg-gray-50">
                        <!-- Elements populated by JS -->
                    </div>
                    <p id="selection-counter" class="text-sm font-medium text-blue-600 mt-2">0/5 Selected</p>
                </div>

                <!-- AI Experiment Design -->
                <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-200">
                    <h2 class="text-xl font-semibold mb-4">2. AI Experiment Design</h2>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Target Material Properties:</label>
                    <textarea id="ai-prompt" class="w-full border border-gray-300 rounded p-3 h-24 mb-4" placeholder="e.g., High thermal stability, suitable for catalytic energy conversion..."></textarea>
                    <button id="generate-plan-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded transition-colors">
                        Generate Synthesis Plan
                    </button>
                </div>

            </div>

            <!-- Right Column: Outputs & Execution -->
            <div class="space-y-6">
                
                <!-- AI Proposed Plan -->
                <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-200">
                    <h2 class="text-xl font-semibold mb-4">Proposed Lab Workflow</h2>
                    <div id="ai-output" class="bg-gray-50 border border-gray-200 rounded p-4 h-40 overflow-y-auto text-sm text-gray-700 whitespace-pre-wrap">Awaiting AI generation...</div>
                    <button id="execute-btn" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded mt-4 transition-colors opacity-50 cursor-not-allowed" disabled>
                        Execute in Hardware Simulator
                    </button>
                </div>

                <!-- Execution Terminal -->
                <div class="bg-gray-900 p-6 rounded-lg shadow-sm border border-gray-700 text-gray-100">
                    <h2 class="text-xl font-semibold mb-4 text-white">Execution Terminal</h2>
                    <div id="terminal-output" class="h-48 overflow-y-auto text-sm bg-black p-3 rounded">
                        <div class="log-info">System initialized. Awaiting commands...</div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script>
        // Mock Element Data (representing PubChem CSV data)
        const mockElements = ['H', 'He', 'Li', 'Be', 'B', 'C', 'N', 'O', 'F', 'Ne', 'Na', 'Mg', 'Al', 'Si', 'P', 'S', 'Cl', 'Ar', 'K', 'Ca', 'Sc', 'Ti', 'V', 'Cr', 'Mn', 'Fe', 'Co', 'Ni', 'Cu', 'Zn'];
        const selectedElements = new Set();

        const elementsList = document.getElementById('elements-list');
        const selectionCounter = document.getElementById('selection-counter');
        const generateBtn = document.getElementById('generate-plan-btn');
        const aiOutput = document.getElementById('ai-output');
        const executeBtn = document.getElementById('execute-btn');
        const terminalOutput = document.getElementById('terminal-output');

        // Render Elements
        mockElements.forEach(symbol => {
            const label = document.createElement('label');
            label.className = 'flex items-center space-x-2 cursor-pointer';
            label.innerHTML = `
                <input type="checkbox" value="${symbol}" class="rounded text-blue-600 focus:ring-blue-500">
                <span class="text-sm font-medium">${symbol}</span>
            `;
            const checkbox = label.querySelector('input');
            checkbox.addEventListener('change', (e) => {
                if (e.target.checked) {
                    if (selectedElements.size >= 5) {
                        e.target.checked = false;
                        alert('Maximum of 5 elements allowed.');
                        return;
                    }
                    selectedElements.add(symbol);
                } else {
                    selectedElements.delete(symbol);
                }
                selectionCounter.textContent = `${selectedElements.size}/5 Selected`;
            });
            elementsList.appendChild(label);
        });

        function logToTerminal(message, type = 'info') {
            const entry = document.createElement('div');
            entry.className = `log-entry log-${type}`;
            const time = new Date().toLocaleTimeString();
            entry.textContent = `[${time}] ${message}`;
            terminalOutput.appendChild(entry);
            terminalOutput.scrollTop = terminalOutput.scrollHeight;
        }

        // Simulate AI Generation
        generateBtn.addEventListener('click', () => {
            if (selectedElements.size < 2) {
                alert('Please select at least 2 elements.');
                return;
            }
            const prompt = document.getElementById('ai-prompt').value;
            generateBtn.disabled = true;
            generateBtn.textContent = 'Generating...';
            
            setTimeout(() => {
                const elementsStr = Array.from(selectedElements).join(', ');
                aiOutput.innerHTML = `<strong>Target Elements:</strong> ${elementsStr}\n<strong>Objective:</strong> ${prompt || 'Default exploration'}\n\n<strong>Synthesis Plan:</strong>\n1. Prepare nanoparticle precursor solutions for ${elementsStr}.\n2. Load into high-throughput printer.\n3. Deposit gradient library at 180°C.\n\n<strong>Characterization Plan:</strong>\n4. Map composition via micro-XRF.\n5. Analyze morphology via SEM.`;
                
                generateBtn.disabled = false;
                generateBtn.textContent = 'Generate Synthesis Plan';
                executeBtn.disabled = false;
                executeBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                logToTerminal(`AI Plan generated for elements: ${elementsStr}`, 'info');
            }, 1500);
        });

        // Simulate Hardware Execution
        executeBtn.addEventListener('click', () => {
            executeBtn.disabled = true;
            logToTerminal('Initializing nanoparticle printer...', 'info');
            
            setTimeout(() => logToTerminal('Calibrating deposition nozzles...', 'info'), 1000);
            setTimeout(() => logToTerminal('Printing material library gradient...', 'warn'), 2500);
            setTimeout(() => logToTerminal('Synthesis complete. Transferring to micro-XRF.', 'info'), 4000);
            setTimeout(() => logToTerminal('XRF mapping finished. Extracting composition data.', 'info'), 5500);
            setTimeout(() => logToTerminal('Run successful. Dataset labeled and saved to database.', 'success'), 7000);
            setTimeout(() => executeBtn.disabled = false, 7500);
        });
    </script>
</body>
</html>
